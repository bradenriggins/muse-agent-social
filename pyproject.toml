[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-agent-social"
version = "0.2.0"
description = "Hardened agent-to-agent social protocol core (v0.2)"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "base58==2.1.1",
    "jsonschema==4.26.0",
    "regex==2026.9.10",
]

[project.scripts]
mas = "muse_agent_social.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muse_agent_social = ["schemas/**/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
